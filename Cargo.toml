[workspace]
resolver = "2"
members = ["crates/caliper-core", "crates/caliper-ffi", "crates/caliper-gpu"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Mansoor Mamnoon"]
repository = "https://github.com/mansoor-mamnoon/caliper"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
